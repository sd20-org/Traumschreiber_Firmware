# Traumschreiber2509 Zephyr Configuration
# Professional firmware configuration for nRF52840-based biometric device

# ========================================================================
# POWER MANAGEMENT
# ========================================================================
CONFIG_PM=y
CONFIG_PM_DEVICE=y
# System OFF when USB is plugged in (charge_guard, fw 0.0.95)
CONFIG_POWEROFF=y

# ========================================================================
# BLUETOOTH & BLE SUPPORT 
# ========================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_DEVICE_NAME="Traumschreiber"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
# CONFIG_BT_CTLR_ADVANCED_FEATURES=y
# CONFIG_BT_CTLR_CONN_RSSI=y
# CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
# CONFIG_BT_CTLR_LE_POWER_CONTROL=y
# TX power: fixed at +4 dBm at build time, not user-settable (no config.txt key).
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
# CONFIG_BT_CTLR_TX_PWR_MINUS_8=y  # minimum power — far too weak with head/pillow

# GATT Services - act as server only; keep GATT enabled for server
# Note: CONFIG_BT_GATT is not a Kconfig symbol in this Zephyr/NCS version; avoid setting it directly.
CONFIG_BT_GATT_SERVICE_CHANGED=y
# Server only (do not enable GATT client in this build)
# CONFIG_BT_GATT_CLIENT is intentionally not set

# ========================================================================
# HIGH-SPEED BLE STREAMING (based on Nordic Throughput sample)
# For 250-500 Hz ADS131M08 data streaming
# ========================================================================

# MTU & Buffer Configuration (Increased for high-rate streaming)
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=252
# Buffer pool sizes raised 12 → 20: at 250Hz × 10 samples/notif we produce
# ~25 notifs/sec. With the previous 12-deep pool, the work handler filled it
# in 4 invocations (each capped at 3 notifs) and the LL drained at ~100
# notifs/s (50ms CI), causing repeated -ENOMEM bursts that dropped 20-40
# samples/sec. Larger pool absorbs the bursts; live BLE air rate is unchanged,
# just more host-side headroom. RAM-bound at ~94% so 20 (not 24) is what fits.
CONFIG_BT_BUF_ACL_TX_COUNT=20
CONFIG_BT_CONN_TX_MAX=20

# ATT Configuration (More buffers for notification pipelining)
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_ATT_TX_COUNT=20

# Controller Configuration (Data Length Extension and 2M PHY)
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=4000000

# BLE Features (Enable DLE and PHY update procedures)
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# Event & Buffer counts (Must be greater than ACL TX count)
CONFIG_BT_BUF_EVT_RX_COUNT=24

# L2CAP Configuration - disable dynamic channels to save RAM (not needed for notify/write)
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=n

# ========================================================================
# ANALOG-TO-DIGITAL CONVERTER (SAADC)
# ========================================================================
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y

# ========================================================================
# SPI SUPPORT (ADS131M08 + microSD)
# ========================================================================
CONFIG_SPI=y

# ========================================================================
# I2S SUPPORT (MAX98357A Audio Amplifier)
# ========================================================================
CONFIG_I2S=y
CONFIG_I2S_NRFX=y

# ========================================================================
# FILE SYSTEM & microSD SUPPORT 
# ========================================================================
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_DISK_DRIVER_SDMMC=y
# CONFIG_EXT2_DISK_STARTING_SECTOR=2082

# Enable f_expand() for EDF file pre-allocation (eliminates cluster-allocation FAT writes during recording)
CONFIG_FS_FATFS_EXTRA_NATIVE_API=y

# Max concurrently-open files. Pinned (was the implicit Zephyr default of 4) so
# the budget is explicit: the recording writer now keeps TWO files open (the
# BDF + its AD####.SNX sample-number index), the backfill reader opens one at a
# time (the .SNX to bisect, then the BDF), plus the occasional transient
# sd_health/CSV write — worst case exactly 4. A future NCS default change must
# not silently drop this below 4 or the critical BDF open could fail in the
# field. RAM is ~maxed (each FIL slab slot is ~0.5 KB), so do NOT raise to 5.
CONFIG_FS_FATFS_NUM_FILES=4

# Long filenames (LFN) — needed since fw 0.0.64: on the app's wall-time sync
# (control 0x40) the active recording is renamed to carry date+time, e.g.
# ADC/AD0007_20260703_2214.BDF. STACK mode keeps the (MAX_LFN+1)*2-byte LFN
# working buffer on the calling thread's stack (~98 B at MAX_LFN=48) — zero
# static RAM (BSS mode would cost ~100 B of the ~190 B that are left).
# MAX_LFN=48 also sizes fs_dirent name buffers (MAX_FILE_NAME follows it),
# bounding the extra readdir stack cost to +36 B per dirent.
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=48

# ========================================================================
# GPIO & PWM SUPPORT (RGB LED, Button)
# ========================================================================
CONFIG_GPIO=y
CONFIG_PWM=y

# ========================================================================
# THREADING & WORKQUEUES
# ========================================================================
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

# Thread priorities for data acquisition
CONFIG_NUM_PREEMPT_PRIORITIES=16

# ========================================================================
# MEMORY MANAGEMENT
# ========================================================================
#CONFIG_HEAP_MEM_POOL_SIZE=8192
# Reduce heap to save RAM; adjust if runtime allocation fails
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=3072

# ========================================================================
# LOGGING & DEBUGGING
# ========================================================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_LOG_BUFFER_SIZE=1536
CONFIG_THREAD_NAME=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_INIT_STACKS=n

# Stack overflow detection
CONFIG_MPU_STACK_GUARD=y

# RTT configuration - uses J-Link for output
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Reduce BLE debug verbosity
CONFIG_BT_LOG_LEVEL_DBG=n

# ========================================================================
# SETTINGS (for BLE bonding, configuration persistence)
# ========================================================================
# Temporarily disable NVS settings for simple LED demo
# CONFIG_SETTINGS=y
# CONFIG_SETTINGS_NVS=y
# CONFIG_NVS=y
# CONFIG_FLASH=y
# CONFIG_FLASH_PAGE_LAYOUT=y
# CONFIG_FLASH_MAP=y
# CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ========================================================================
# NETWORKING STACK (minimal for BLE)
# ========================================================================
CONFIG_NETWORKING=n

# ========================================================================
# SHELL SUPPORT (for debugging & testing) - Disabled to avoid RTT conflicts
# ========================================================================
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_RTT=n
CONFIG_SHELL_BACKEND_SERIAL=n

# Device shell commands - disabled
CONFIG_DEVICE_SHELL=n
CONFIG_KERNEL_SHELL=n

# ========================================================================
# TIMING & CLOCK MANAGEMENT
# ========================================================================
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Use the external 32.768 kHz crystal (LFXO) on E73 module for better accuracy & lower power
# NOTE: LFXO does not start on this E73-2G4M08S1C module (crystal likely not populated)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ========================================================================
# PRINTF & STRING FORMATTING
# ========================================================================
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# ========================================================================
# SECURITY & CRYPTO
# ========================================================================
CONFIG_ENTROPY_GENERATOR=y

# ========================================================================
# WATCHDOG (optional, for production reliability)
# ========================================================================
# CONFIG_WATCHDOG=y

# ========================================================================
# FOTA / MCUboot / MCUmgr (BLE SMP)
# ========================================================================
CONFIG_BOOTLOADER_MCUBOOT=y

# Image management
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# BLE transport for mcumgr SMP
CONFIG_MCUMGR_TRANSPORT_BT=y

# Flash mapping needed by image manager
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y

# CBOR codec used by mcumgr
CONFIG_ZCBOR=y

# Keep update path reliable with larger workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072